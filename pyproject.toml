[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "raahi"
version = "0.1.0"
description = "Evidence-aware Delhi bus journey planning"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "duckdb", "pandas", "pyarrow", "numpy", "tzdata"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
